# AI 论文档案库 · 每周自动刷新
#
# 默认每天 01:00 UTC（北京时间 09:00）自动：
#   抓取近 7 天 AI HOT → 校验数据 → 提交数据到 main → 构建 → 发布到 gh-pages
# 也可在 GitHub 网页「Actions → 此工作流 → Run workflow」手动触发，
# 并可勾选「跳过抓取」用现有数据重新构建发布。
#
# 失败处理：任一步失败即中止，保留上一版线上站点（绝不发布空卷宗）。

name: Weekly Refresh

on:
  schedule:
    # 每天 01:00 UTC = 北京时间 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "跳过抓取，用现有数据重新构建发布"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXT_BASE_PATH: /ai-paper-archive
      NEXT_PUBLIC_SITE_URL: https://daveysong-ai.github.io/ai-paper-archive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh (fetch → validate → commit → build → deploy)
        run: |
          ARGS=()
          if [ "${{ github.event.inputs.skip_fetch }}" = "true" ]; then
            ARGS+=(--no-fetch)
          fi
          ./scripts/refresh-weekly.sh "${ARGS[@]}"
